name: Daily Digest

# One Hebrew morning digest (07:00 Israel = 04:00 UTC) rolling up CI health, live
# product health, open action items, and unresolved feedback — with a deeper
# weekly section on Sundays. Read-only; reuses existing secrets. Replaces scattered
# raw notifications with a single email.

on:
  schedule:
    - cron: '0 4 * * *'   # 04:00 UTC = 07:00 Israel
  workflow_dispatch:

concurrency:
  group: daily-digest
  cancel-in-progress: false

permissions:
  contents: read
  issues: read
  pull-requests: read
  actions: read          # required to read workflow-run conclusions (CI health)

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
      MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Compose digest
        id: digest
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node scripts/daily-digest.mjs

      - name: Email digest
        if: ${{ env.MAIL_USERNAME != '' && env.MAIL_PASSWORD != '' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: SwingEdge Digest <${{ secrets.MAIL_USERNAME }}>
          to: niveven183@gmail.com
          subject: "☀️ SwingEdge — סיכום יומי (${{ steps.digest.outputs.date }})"
          body: ${{ steps.digest.outputs.digest }}

      - name: Note missing mail secrets
        if: ${{ env.MAIL_USERNAME == '' || env.MAIL_PASSWORD == '' }}
        run: echo "::warning::MAIL_USERNAME/MAIL_PASSWORD not set — email skipped, digest is in the job summary above."

      - name: Report to Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
          D_DATE: ${{ steps.digest.outputs.date }}
          FB_UNRESOLVED: ${{ steps.digest.outputs.feedback_unresolved }}
          FB_SNIPPET: ${{ steps.digest.outputs.feedback_snippet }}
        run: |
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::SENTINEL_DISCORD_WEBHOOK not set — skipping Discord."
            exit 0
          fi
          COLOR=3066993
          DESC="$(printf '%s\n' "סיכום יומי הושלם ($D_DATE)." "פירוט מלא נשלח במייל.")"
          # Numeric guard also covers a partial deploy where this output doesn't exist yet —
          # falls back to the old behavior instead of breaking.
          if printf '%s' "${FB_UNRESOLVED:-}" | grep -qE '^[0-9]+$' && [ "${FB_UNRESOLVED:-0}" -gt 0 ]; then
            COLOR=15844367
            DESC="$(printf '%s\n' "$DESC" "💬 ${FB_UNRESOLVED} פידבקים ממתינים" "${FB_SNIPPET:-}")"
          fi
          payload="$(jq -n --arg u "SwingEdge Digest" --arg t "☀️ Daily Digest" --arg d "$DESC" --argjson c "$COLOR" \
            '{username:$u, embeds:[{title:$t, description:$d, color:$c}]}')"
          curl -sS -o /dev/null -w 'discord POST -> HTTP %{http_code}\n' \
            -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK"
