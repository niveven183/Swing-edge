name: Eye · Playbook images (C-064)

# C-064 closed by a machine (Niv, 04.10). Plan: docs/plans/PLAN-2026-10-04-c064-eye-auto.md
#
#   probe — hermetic red-before: five builds (HEAD · LEGACY · MUT-D · MUT-E · MUT-B402) × two devices,
#           against a synthetic Supabase. Zero secrets. Proves every step CAN go red.
#   probe-overlay — B-404 · B-405 (04.10): hermetic red-before for tests-eye/overlay.spec.js
#           (HEAD · BEFORE · MUT-PAD · MUT-IOS) × five devices. No banner is ever closed.
#   probe-sync — B-406 · B-397 · B-407 (05.10): node mutants (test:hydration) · keys-only journal
#           (probe:image G1J) · hermetic arms of tests-eye/hydration.spec.js (HEAD · BEFORE ·
#           MUT-EARLY · MUT-OVERWRITE · MUT-RESURRECT) × two devices.
#   probe-cents — K2 · B-321 + B-325 (05.10): hermetic arms of tests-eye/cents.spec.js
#           (HEAD · MUT-A1 · MUT-B7 · ILS-* · MUT-EXIT/ENTRY-DROP) × two devices. Zero secrets.
#           + probe:eye:focus — B-415 (12.10): tests-eye/modal-focus.spec.js (HEAD · MUT-RAF).
#   prod  — both specs against https://swing-edge.com with the QA account. playbook writes
#           e2e-c064-* setups and one EYEPB trade, then sweeps them and proves 0 residue;
#           overlay blocks every REST write and only reads.
#
# ⚠️ Emulation, ⛔ a physical iPhone: `iPhone 14` is WebKit with an iPhone UA/viewport/touch.
# Readability is OCR as a PROXY for the eye. Both gaps are registered (DECISIONS 04.10).

on:
  workflow_dispatch:
  # Weekly. ⛔ minutes :20/:50 — the sentinel's hourly slots on the SAME QA account
  # (Niv, 04.10, fix ②). Monday 05:37 UTC: clear of the sentinel and of smoke (04:00).
  schedule:
    - cron: '37 5 * * 1'
  push:
    branches: [main]
    paths:
      # B-426 (14.10, Niv): every App change runs the eye — the repo is public ⇒ minutes are free, the cost is time.
      - 'SwingEdge_App.jsx'
      - 'src/**'
      - 'src/lib/imageResize.js'
      - 'src/lib/playbookStore.js'
      - 'src/components/ToastProvider.jsx'
      - 'tests-eye/**'
      - 'playwright.eye.config.js'
      - 'scripts/eye-playbook-probe.mjs'
      - 'scripts/eye-evidence-scan.mjs'
      - 'scripts/b435-alert.mjs'      # B-435 (17.10): the prod alert
      - 'src/components/ConsentBanner.jsx'
      - 'src/components/ConsentBanner.css'
      - 'src/components/IOSInstallBanner.jsx'
      - 'src/components/AuthScreen.jsx'
      - 'src/lib/bottomOverlay.js'
      - 'src/hooks/useBottomOverlay.js'
      - 'scripts/eye-overlay-probe.mjs'
      - 'scripts/eye-width-probe.mjs'
      - 'scripts/lib/eyeBuild.mjs'
      - 'scripts/lib/syncArms.mjs'   # B-425: eye-sync-probe's arms
      - 'src/lib/settingsDelta.js'
      - 'src/lib/userSettings.js'
      - 'scripts/eye-sync-probe.mjs'
      - 'scripts/image-store-probe.mjs'
      - 'scripts/hydration-wiring-test.mjs'
      - 'scripts/eye-cents-probe.mjs'
      - 'scripts/eye-focus-probe.mjs'
      - 'scripts/eye-firstrun-probe.mjs'   # activation wave 1 (21.10)
      - 'scripts/eye-wave1-probe.mjs'      # fix round 1 (28.10, B-456…B-460)
      - 'scripts/sentry-scrub-probe.mjs'   # B-458
      - 'src/hooks/useModalA11y.js'
      - 'scripts/cents-precision-test.mjs'
      - '.github/workflows/eye-playbook.yml'
  pull_request:
    paths:   # same list as push
      # B-426 (14.10, Niv): every App change runs the eye — the repo is public ⇒ minutes are free, the cost is time.
      - 'SwingEdge_App.jsx'
      - 'src/**'
      - 'src/lib/imageResize.js'
      - 'src/lib/playbookStore.js'
      - 'src/components/ToastProvider.jsx'
      - 'tests-eye/**'
      - 'playwright.eye.config.js'
      - 'scripts/eye-playbook-probe.mjs'
      - 'scripts/eye-evidence-scan.mjs'
      - 'scripts/b435-alert.mjs'      # B-435 (17.10): the prod alert
      - 'src/components/ConsentBanner.jsx'
      - 'src/components/ConsentBanner.css'
      - 'src/components/IOSInstallBanner.jsx'
      - 'src/components/AuthScreen.jsx'
      - 'src/lib/bottomOverlay.js'
      - 'src/hooks/useBottomOverlay.js'
      - 'scripts/eye-overlay-probe.mjs'
      - 'scripts/eye-width-probe.mjs'
      - 'scripts/lib/eyeBuild.mjs'
      - 'scripts/lib/syncArms.mjs'   # B-425: eye-sync-probe's arms
      - 'src/lib/settingsDelta.js'
      - 'src/lib/userSettings.js'
      - 'scripts/eye-sync-probe.mjs'
      - 'scripts/image-store-probe.mjs'
      - 'scripts/hydration-wiring-test.mjs'
      - 'scripts/eye-cents-probe.mjs'
      - 'scripts/eye-focus-probe.mjs'
      - 'scripts/eye-firstrun-probe.mjs'   # activation wave 1 (21.10)
      - 'scripts/eye-wave1-probe.mjs'      # fix round 1 (28.10, B-456…B-460)
      - 'scripts/sentry-scrub-probe.mjs'   # B-458
      - 'src/hooks/useModalA11y.js'
      - 'scripts/cents-precision-test.mjs'
      - '.github/workflows/eye-playbook.yml'

# One run at a time on the QA row; ⛔ cancel (a cancelled run skips its own sweep).
# ⛔ the `sentinel` group: a new pending run replaces a pending one, which would drop a
# pending sentinel run.
concurrency:
  group: eye-playbook
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # The playwright image carries WebKit's system libraries; `--with-deps` was removed from
    # smoke.yml as unbounded. Pinned to the lockfile's @playwright/test.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # LEGACY reads SwingEdge_App.jsx from 3d24c23
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe (both devices)
        env:
          EYE_PROJECTS: pixel7,iphone14
        run: npm run probe:eye:playbook
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-playbook-probe-${{ github.run_id }}
          path: eye-evidence/probe/
          retention-days: 14
          if-no-files-found: warn

  # B-404 · B-405 — separate job so it runs in parallel with the playbook probe (each is
  # four builds; together they would not fit one job's budget).
  probe-overlay:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads the pre-fix files from d1e05e1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — overlay (five devices)
        env:
          EYE_PROJECTS: pixel7,iphone14,iphoneSE,iphone14promax,galaxyS8
        run: npm run probe:eye:overlay
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload overlay probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-overlay-probe-${{ github.run_id }}
          path: eye-evidence/probe-overlay/
          retention-days: 14
          if-no-files-found: warn
      # B-424 (13.10) — no main tab wider than the phone (tests-eye/width.spec.js), same five devices.
      - name: Red-before probe — page width (five devices)
        if: ${{ always() }}
        env:
          EYE_PROJECTS: pixel7,iphone14,iphoneSE,iphone14promax,galaxyS8
        run: npm run probe:eye:width
      - name: Upload width probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-width-probe-${{ github.run_id }}
          path: eye-evidence/probe-width/
          retention-days: 14
          if-no-files-found: warn

  # Activation wave 1 (21.10, B-443…B-448) — tests-eye/firstrun.spec.js: HEAD green · BEFORE (faf691a) red ·
  # 11 mutants each killed by its own message. A separate job, ⛔ in prod.needs (a mutant arm is never
  # deployed — B-442); prod runs the spec itself against production after the deploy.
  probe-firstrun:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads the pre-fix files from faf691a
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — first run (iPhone 14 ×2 heights · Pixel 7 · desktop 1440)
        env:
          EYE_PROJECTS: iphone14,iphone14tall,pixel7,desktop1440
        run: npm run probe:eye:firstrun
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload first-run probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-firstrun-probe-${{ github.run_id }}
          path: eye-evidence/probe-firstrun/
          retention-days: 14
          if-no-files-found: warn

  # Fix round 1 (28.10, B-456…B-460) — tests-eye/wave1.spec.js: HEAD green · BEFORE (9f47d5f) red · one mutant
  # per finding, each killed by its own message; plus probe:sentry (the real SDK, HEAD/BEFORE/MUT-F3).
  # ⛔ in prod.needs (B-442: a mutant arm is never deployed). probe:renders stays local (a render count on a
  # shared runner is noise, ⛔ a gate; test:perf in verify holds the shape).
  probe-wave1:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads the pre-fix files from 9f47d5f
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: probe:sentry — 0 token values in every envelope (HEAD) · BEFORE + MUT-F3 leak
        run: npm run probe:sentry
      - name: Red-before probe — wave 1 (Pixel 7 · iPhone 14 · desktop 1440)
        env:
          EYE_PROJECTS: wave1-pixel7,wave1-iphone14,wave1-desktop1440
        run: npm run probe:eye:wave1
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload wave 1 probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-wave1-probe-${{ github.run_id }}
          path: eye-evidence/probe-wave1/
          retention-days: 14
          if-no-files-found: warn

  # Fix round 1 against PRODUCTION after this commit's deploy (push / dispatch only — on a PR the code is not
  # deployed). Its own job: `prod` already takes ~22 of its 40 minutes (run 39637288711). ⛔ The QA row is
  # never read or written (user_settings + trades answered locally, every other REST write blocked) and every
  # Sentry envelope is answered locally ⇒ it can run beside `prod`.
  prod-wave1:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    # single-value form on purpose: scripts/workflow-gate-test.mjs M1 identifies `prod` as the one `needs: [… wait-deploy …]` line.
    needs: wait-deploy
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: wave 1 against production (QA account · iPhone 14 · Pixel 7 · 1440 · he + en)
        env:
          CI: 'true'
          EYE_WAVE1: '1'
          TEST_URL: ${{ vars.TEST_URL || 'https://swing-edge.com' }}
          EYE_JSON: eye-wave1-results.json   # outside eye-evidence/: never uploaded
          SENTINEL_QA_EMAIL: ${{ secrets.SENTINEL_QA_EMAIL }}
          SENTINEL_QA_PASSWORD: ${{ secrets.SENTINEL_QA_PASSWORD }}
        run: npx playwright test -c playwright.eye.config.js tests-eye/wave1.spec.js
      # The artifact is world-readable: it is uploaded ONLY if the leak scan is clean.
      - name: Leak scan (counts only)
        id: scan
        if: ${{ always() }}
        env:
          SENTINEL_QA_EMAIL: ${{ secrets.SENTINEL_QA_EMAIL }}
          SENTINEL_QA_PASSWORD: ${{ secrets.SENTINEL_QA_PASSWORD }}
        run: node scripts/eye-evidence-scan.mjs eye-evidence
      - name: Upload wave 1 production evidence
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-wave1-prod-${{ github.run_id }}
          path: eye-evidence/wave1/
          retention-days: 14
          if-no-files-found: warn

  # B-406 · B-397 · B-407 — the hydration delta merge on the COMMITTED tree (the HEAD arm only).
  # B-442 (Niv 19.10): this is the half `prod` waits on — production verification depends on the deployed
  # tree being green, ⛔ on a mutant arm that is never deployed (INCIDENTS#36: three runs skipped on a C4 control).
  probe-sync-head:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # B-408 (14.10): 5 → 14 arms (BEFORE-408 · M3-EARLY · M3-<scalar>×5 · M3-FAILLOCK · M5-NOTIMEOUT),
    # each limited to its own scenes by --grep. 60 was the old ceiling with 5 full-spec arms.
    # B-442 (19.10): split from the one `probe-sync` job — timeout and fetch-depth moved as they were.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads 19959e6 · probe:image reads 3d24c23
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — hydration delta merge (two devices · head)
        env:
          EYE_PROJECTS: pixel7,iphone14
          EYE_SYNC_SCOPE: head
        run: npm run probe:eye:sync
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload sync probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-sync-probe-head-${{ github.run_id }}
          path: eye-evidence/probe-sync/
          retention-days: 14
          if-no-files-found: warn

  # B-442 — node mutants + every BEFORE-*/MUT-*/M3-*/M5-* arm. Still a failing check (the PR shows it red; the
  # step summary classifies each failure: mutant SURVIVED · control red · instrument), ⛔ a gate for `prod`.
  # ⛔ continue-on-error · ⛔ retry: a hidden red is the bug B-442 exists against.
  probe-sync-mutants:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    # B-408 (14.10): 5 → 14 arms (BEFORE-408 · M3-EARLY · M3-<scalar>×5 · M3-FAILLOCK · M5-NOTIMEOUT),
    # each limited to its own scenes by --grep. 60 was the old ceiling with 5 full-spec arms.
    # B-442 (19.10): split from the one `probe-sync` job — timeout and fetch-depth moved as they were.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads 19959e6 · probe:image reads 3d24c23
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — hydration delta merge (two devices · mutants)
        env:
          EYE_PROJECTS: pixel7,iphone14
          EYE_SYNC_SCOPE: mutants
        run: npm run probe:eye:sync
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload sync probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-sync-probe-mutants-${{ github.run_id }}
          path: eye-evidence/probe-sync/
          retention-days: 14
          if-no-files-found: warn

  # K2 · B-321 + B-325 (05.10) — the money-cents eye spec's red-before, in parallel with the others.
  probe-cents:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — money cents (two devices)
        env:
          EYE_PROJECTS: pixel7,iphone14
        run: npm run probe:eye:cents
      - name: Red-before probe — modal focus (B-415, two devices)
        if: ${{ always() }}
        env:
          EYE_PROJECTS: pixel7,iphone14
        run: npm run probe:eye:focus
      - name: Upload focus probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-focus-probe-${{ github.run_id }}
          path: eye-evidence/probe-focus/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload cents probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-cents-probe-${{ github.run_id }}
          path: eye-evidence/probe-cents/
          retention-days: 14
          if-no-files-found: warn

  # `gh` is not in the playwright image — the deploy wait runs on the plain runner.
  wait-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for this commit's deploy to be live (push only)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Same contract as smoke.yml: testing whatever is live would be a false ✅.
          deadline=$(( SECONDS + 180 ))
          while :; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&environment=Production" --jq '.[].id' 2>/dev/null | grep -E '^[0-9]+$' || true)
            states=""
            for id in $ids; do states="$states $(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[].state' 2>/dev/null | tr '\n' ' ')"; done
            echo "t=${SECONDS}s sha=${SHA:0:7} states=[${states} ]"
            case " $states " in
              *" success "*) echo "✅ ${SHA:0:7} is live"; exit 0 ;;
              *" failure "*|*" error "*) echo "::error::deploy for ${SHA:0:7} failed"; exit 1 ;;
            esac
            if (( SECONDS >= deadline )); then echo "::error::no successful Production deploy for ${SHA:0:7} in 180s"; exit 1; fi
            sleep 10
          done
      - run: echo "not a push — production is whatever main last deployed (${{ github.event_name }})"
        if: ${{ github.event_name != 'push' }}

  prod:
    # B-442 (Niv 19.10): production verification waits on the deploy and on the HEAD arms of the hydration probe ONLY.
    # The other probes (probe · probe-overlay · probe-cents · probe-sync-mutants) still run and still fail the run —
    # they are ⛔ a gate for checking production. scripts/workflow-gate-test.mjs (in test:registry) enforces this.
    needs: [wait-deploy, probe-sync-head]
    runs-on: ubuntu-latest
    # B-435 (Niv 17.10, 2ג): issues: write — ONLY this job, ONLY for the B-435 alert below. A job-level block
    # replaces the workflow's, so the two read scopes are restated.
    permissions:
      contents: read
      deployments: read
      issues: write
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: C-064 against production (QA account)
        env:
          CI: 'true'
          TEST_URL: ${{ vars.TEST_URL || 'https://swing-edge.com' }}
          EYE_JSON: eye-results.json   # outside eye-evidence/: never uploaded
          # Existing secrets only (the sentinel reads them) — ⛔ a new secret, ⛔ a value.
          SENTINEL_QA_EMAIL: ${{ secrets.SENTINEL_QA_EMAIL }}
          SENTINEL_QA_PASSWORD: ${{ secrets.SENTINEL_QA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # A PR's code is NOT on production yet: overlay.spec measures the deployed app, so on
          # a pull_request it would only re-measure the bug (run 37209074890: 16/16 overlay red
          # on prod, 12/12 playbook green — the live red-before). It runs on push to main after
          # the deploy wait (the D-114 closing run), and on dispatch / schedule.
          # Step f of playbook.spec (`@deployed`, B-406) needs the fix ON production — same reason.
          SPECS: ${{ github.event_name == 'pull_request' && 'tests-eye/playbook.spec.js --grep-invert @deployed' || '' }}
          # B-402: the F2b gate in step d needs the 2000px profile ON production — same reason.
          EYE_PRE_DEPLOY: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npx playwright test -c playwright.eye.config.js $SPECS
      # B-435 (Niv 17.10, 2ג) — a red playbook b on production keeps its evidence past the 14-day artifact and
      # opens (or comments on) the open B-435 issue: the next occurrence must not depend on someone reading a
      # log within two weeks. scripts/b435-alert.mjs exits 2 on a report it cannot read (⛔ a silent «green»).
      # The issue body is written into eye-evidence/ HERE, before the leak scan, so the scan covers it too.
      - name: B-435 — was playbook b red?
        id: b435
        if: ${{ always() }}
        run: node scripts/b435-alert.mjs eye-results.json eye-evidence eye-evidence/b435-issue.md
      # The artifact is world-readable: it is uploaded ONLY if the leak scan is clean.
      - name: Leak scan (counts only)
        id: scan
        if: ${{ always() }}
        env:
          SENTINEL_QA_EMAIL: ${{ secrets.SENTINEL_QA_EMAIL }}
          SENTINEL_QA_PASSWORD: ${{ secrets.SENTINEL_QA_PASSWORD }}
        run: node scripts/eye-evidence-scan.mjs eye-evidence
      - name: Upload evidence (screenshots · stored images · ocr.json · cleanup.json)
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-playbook-prod-${{ github.run_id }}
          path: |
            eye-evidence/
            !eye-evidence/probe/
            !eye-evidence/probe-overlay/
            !eye-evidence/probe-sync/
            !eye-evidence/probe-cents/
            !eye-evidence/probe-focus/
            !eye-evidence/probe-firstrun/
            !eye-evidence/probe-wave1/
            !eye-evidence/wave1/
          retention-days: 14
          if-no-files-found: warn
      - name: B-435 — keep the evidence 90 days
        if: ${{ always() && steps.b435.outputs.red != '' && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: b435-evidence-${{ github.run_id }}
          path: |
            eye-evidence/
            !eye-evidence/probe/
            !eye-evidence/probe-overlay/
            !eye-evidence/probe-sync/
            !eye-evidence/probe-cents/
            !eye-evidence/probe-focus/
            !eye-evidence/probe-firstrun/
            !eye-evidence/probe-wave1/
            !eye-evidence/wave1/
          retention-days: 90
          if-no-files-found: error
      - name: B-435 — open the issue, or comment on the open one
        if: ${{ always() && steps.b435.outputs.red != '' }}
        uses: actions/github-script@v9
        env:
          SCAN_OK: ${{ steps.scan.outcome == 'success' && '1' || '' }}
          RED: ${{ steps.b435.outputs.red }}
        with:
          script: |
            const fs = require('fs');
            const label = 'B-435';
            const { owner, repo } = context.repo;
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (e) {
              if (e.status !== 404) throw e;
              await github.rest.issues.createLabel({ owner, repo, name: label, color: 'b60205', description: 'Production: a playbook setup lost after reload (docs/BACKLOG.md B-435)' });
            }
            // ⛔ an unscanned body on a public issue: if the leak scan did not pass, only the run link is published.
            const body = process.env.SCAN_OK === '1'
              ? fs.readFileSync('eye-evidence/b435-issue.md', 'utf8')
              : `🔴 **B-435 recurred** — playbook b red on production (${process.env.RED}).\n\nRun: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}\n\n⛔ Evidence and diag withheld: the leak scan did not pass. Read the job log.`;
            const open = await github.rest.issues.listForRepo({ owner, repo, state: 'open', labels: label, per_page: 1 });
            if (open.data.length) {
              const n = open.data[0].number;
              await github.rest.issues.createComment({ owner, repo, issue_number: n, body });
              core.notice(`B-435: commented on #${n}`);
            } else {
              const { data } = await github.rest.issues.create({ owner, repo, title: `B-435 · playbook b red on production (run ${context.runId})`, body, labels: [label] });
              core.notice(`B-435: opened #${data.number}`);
            }
