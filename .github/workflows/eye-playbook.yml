name: Eye · Playbook images (C-064)

# C-064 closed by a machine (Niv, 04.10). Plan: docs/plans/PLAN-2026-10-04-c064-eye-auto.md
#
#   probe — hermetic red-before: five builds (HEAD · LEGACY · MUT-D · MUT-E · MUT-B402) × two devices,
#           against a synthetic Supabase. Zero secrets. Proves every step CAN go red.
#   probe-overlay — B-404 · B-405 (04.10): hermetic red-before for tests-eye/overlay.spec.js
#           (HEAD · BEFORE · MUT-PAD · MUT-IOS) × five devices. No banner is ever closed.
#   probe-sync — B-406 · B-397 · B-407 (05.10): node mutants (test:hydration) · keys-only journal
#           (probe:image G1J) · hermetic arms of tests-eye/hydration.spec.js (HEAD · BEFORE ·
#           MUT-EARLY · MUT-OVERWRITE · MUT-RESURRECT) × two devices.
#   prod  — both specs against https://swing-edge.com with the QA account. playbook writes
#           e2e-c064-* setups and one EYEPB trade, then sweeps them and proves 0 residue;
#           overlay blocks every REST write and only reads.
#
# ⚠️ Emulation, ⛔ a physical iPhone: `iPhone 14` is WebKit with an iPhone UA/viewport/touch.
# Readability is OCR as a PROXY for the eye. Both gaps are registered (DECISIONS 04.10).

on:
  workflow_dispatch:
  # Weekly. ⛔ minutes :20/:50 — the sentinel's hourly slots on the SAME QA account
  # (Niv, 04.10, fix ②). Monday 05:37 UTC: clear of the sentinel and of smoke (04:00).
  schedule:
    - cron: '37 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'src/lib/imageResize.js'
      - 'src/lib/playbookStore.js'
      - 'src/components/ToastProvider.jsx'
      - 'tests-eye/**'
      - 'playwright.eye.config.js'
      - 'scripts/eye-playbook-probe.mjs'
      - 'scripts/eye-evidence-scan.mjs'
      - 'src/components/ConsentBanner.jsx'
      - 'src/components/ConsentBanner.css'
      - 'src/components/IOSInstallBanner.jsx'
      - 'src/components/AuthScreen.jsx'
      - 'src/lib/bottomOverlay.js'
      - 'src/hooks/useBottomOverlay.js'
      - 'scripts/eye-overlay-probe.mjs'
      - 'scripts/lib/eyeBuild.mjs'
      - 'src/lib/settingsDelta.js'
      - 'src/lib/userSettings.js'
      - 'scripts/eye-sync-probe.mjs'
      - 'scripts/image-store-probe.mjs'
      - 'scripts/hydration-wiring-test.mjs'
      - '.github/workflows/eye-playbook.yml'
  pull_request:
    paths:   # same list as push
      - 'src/lib/imageResize.js'
      - 'src/lib/playbookStore.js'
      - 'src/components/ToastProvider.jsx'
      - 'tests-eye/**'
      - 'playwright.eye.config.js'
      - 'scripts/eye-playbook-probe.mjs'
      - 'scripts/eye-evidence-scan.mjs'
      - 'src/components/ConsentBanner.jsx'
      - 'src/components/ConsentBanner.css'
      - 'src/components/IOSInstallBanner.jsx'
      - 'src/components/AuthScreen.jsx'
      - 'src/lib/bottomOverlay.js'
      - 'src/hooks/useBottomOverlay.js'
      - 'scripts/eye-overlay-probe.mjs'
      - 'scripts/lib/eyeBuild.mjs'
      - 'src/lib/settingsDelta.js'
      - 'src/lib/userSettings.js'
      - 'scripts/eye-sync-probe.mjs'
      - 'scripts/image-store-probe.mjs'
      - 'scripts/hydration-wiring-test.mjs'
      - '.github/workflows/eye-playbook.yml'

# One run at a time on the QA row; ⛔ cancel (a cancelled run skips its own sweep).
# ⛔ the `sentinel` group: a new pending run replaces a pending one, which would drop a
# pending sentinel run.
concurrency:
  group: eye-playbook
  cancel-in-progress: false

permissions:
  contents: read
  deployments: read

jobs:
  probe:
    runs-on: ubuntu-latest
    # The playwright image carries WebKit's system libraries; `--with-deps` was removed from
    # smoke.yml as unbounded. Pinned to the lockfile's @playwright/test.
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # LEGACY reads SwingEdge_App.jsx from 3d24c23
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe (both devices)
        env:
          EYE_PROJECTS: pixel7,iphone14
        run: npm run probe:eye:playbook
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-playbook-probe-${{ github.run_id }}
          path: eye-evidence/probe/
          retention-days: 14
          if-no-files-found: warn

  # B-404 · B-405 — separate job so it runs in parallel with the playbook probe (each is
  # four builds; together they would not fit one job's budget).
  probe-overlay:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads the pre-fix files from d1e05e1
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — overlay (five devices)
        env:
          EYE_PROJECTS: pixel7,iphone14,iphoneSE,iphone14promax,galaxyS8
        run: npm run probe:eye:overlay
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload overlay probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-overlay-probe-${{ github.run_id }}
          path: eye-evidence/probe-overlay/
          retention-days: 14
          if-no-files-found: warn

  # B-406 · B-397 · B-407 — its own job, in parallel with the other two probes.
  probe-sync:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # BEFORE reads 19959e6 · probe:image reads 3d24c23
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - name: Red-before probe — hydration delta merge (two devices)
        env:
          EYE_PROJECTS: pixel7,iphone14
        run: npm run probe:eye:sync
      # Hermetic evidence: synthetic origin, dummy account, no secret exists in this job.
      - name: Upload sync probe evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-sync-probe-${{ github.run_id }}
          path: eye-evidence/probe-sync/
          retention-days: 14
          if-no-files-found: warn

  # `gh` is not in the playwright image — the deploy wait runs on the plain runner.
  wait-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for this commit's deploy to be live (push only)
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # Same contract as smoke.yml: testing whatever is live would be a false ✅.
          deadline=$(( SECONDS + 180 ))
          while :; do
            ids=$(gh api "repos/${GITHUB_REPOSITORY}/deployments?sha=${SHA}&environment=Production" --jq '.[].id' 2>/dev/null | grep -E '^[0-9]+$' || true)
            states=""
            for id in $ids; do states="$states $(gh api "repos/${GITHUB_REPOSITORY}/deployments/${id}/statuses" --jq '.[].state' 2>/dev/null | tr '\n' ' ')"; done
            echo "t=${SECONDS}s sha=${SHA:0:7} states=[${states} ]"
            case " $states " in
              *" success "*) echo "✅ ${SHA:0:7} is live"; exit 0 ;;
              *" failure "*|*" error "*) echo "::error::deploy for ${SHA:0:7} failed"; exit 1 ;;
            esac
            if (( SECONDS >= deadline )); then echo "::error::no successful Production deploy for ${SHA:0:7} in 180s"; exit 1; fi
            sleep 10
          done
      - run: echo "not a push — production is whatever main last deployed (${{ github.event_name }})"
        if: ${{ github.event_name != 'push' }}

  prod:
    needs: [probe, probe-overlay, probe-sync, wait-deploy]
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.61.1-noble
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - run: npm ci
      - name: C-064 against production (QA account)
        env:
          CI: 'true'
          TEST_URL: ${{ vars.TEST_URL || 'https://swing-edge.com' }}
          EYE_JSON: eye-results.json   # outside eye-evidence/: never uploaded
          # Existing secrets only (the sentinel reads them) — ⛔ a new secret, ⛔ a value.
          SENTINEL_QA_EMAIL: ${{ secrets.SENTINEL_QA_EMAIL }}
          SENTINEL_QA_PASSWORD: ${{ secrets.SENTINEL_QA_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # A PR's code is NOT on production yet: overlay.spec measures the deployed app, so on
          # a pull_request it would only re-measure the bug (run 37209074890: 16/16 overlay red
          # on prod, 12/12 playbook green — the live red-before). It runs on push to main after
          # the deploy wait (the D-114 closing run), and on dispatch / schedule.
          # Step f of playbook.spec (`@deployed`, B-406) needs the fix ON production — same reason.
          SPECS: ${{ github.event_name == 'pull_request' && 'tests-eye/playbook.spec.js --grep-invert @deployed' || '' }}
          # B-402: the F2b gate in step d needs the 2000px profile ON production — same reason.
          EYE_PRE_DEPLOY: ${{ github.event_name == 'pull_request' && '1' || '' }}
        run: npx playwright test -c playwright.eye.config.js $SPECS
      # The artifact is world-readable: it is uploaded ONLY if the leak scan is clean.
      - name: Leak scan (counts only)
        id: scan
        if: ${{ always() }}
        env:
          SENTINEL_QA_EMAIL: ${{ secrets.SENTINEL_QA_EMAIL }}
          SENTINEL_QA_PASSWORD: ${{ secrets.SENTINEL_QA_PASSWORD }}
        run: node scripts/eye-evidence-scan.mjs eye-evidence
      - name: Upload evidence (screenshots · stored images · ocr.json · cleanup.json)
        if: ${{ always() && steps.scan.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: eye-playbook-prod-${{ github.run_id }}
          path: |
            eye-evidence/
            !eye-evidence/probe/
            !eye-evidence/probe-overlay/
            !eye-evidence/probe-sync/
          retention-days: 14
          if-no-files-found: warn
