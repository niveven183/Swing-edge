name: Fleet Daily

# 24/7 replacement for two local Cowork agents (Cost Watchdog + Growth Pulse).
# Runs in GitHub Actions so it no longer depends on Niv's Mac being awake and
# Claude Desktop being open. Reports four Discord embeds (💰 Cost, 📈 Growth,
# 🐕 Watchdog liveness, 🔗 Alert correlation) via the shared Sentinel webhook.
# Read-only: SELECT-only psql over the existing
# SUPABASE_DB_URL, zero repo writes, aggregate numbers only (no PII, no secrets
# in output). Day-over-day deltas persist via the Actions cache (Sentinel's
# pattern). Complements — never replaces — Sentinel/health/smoke.

on:
  schedule:
    - cron: '0 6 * * *'   # 06:00 UTC = 09:00 Israel
  workflow_dispatch:

concurrency:
  group: fleet-daily
  cancel-in-progress: true

permissions:
  contents: read           # zero repo writes
  actions: read            # to read watchdog.yml's run history (Watchdog liveness step)

jobs:
  fleet-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Restore day-over-day state
        uses: actions/cache/restore@v6
        with:
          path: .fleet-state
          key: fleet-daily-state-${{ github.run_id }}
          restore-keys: |
            fleet-daily-state-

      - name: Cost Watchdog
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          set -uo pipefail
          set +e                    # runner injects `bash -e`; disable it so a single failing query degrades per-metric instead of aborting
          RED=15158332; AMBER=15844367; GREEN=3066993
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          RO="SET default_transaction_read_only = on;"
          psql_q() { # runs one read-only query; on error surfaces psql's first line (never the conn string) and returns empty
            local out
            out="$(psql -v ON_ERROR_STOP=1 -tAq "$SUPABASE_DB_URL" -c "$RO $1" 2>/tmp/psqlerr)" \
              || echo "::warning::psql query failed: $(head -1 /tmp/psqlerr 2>/dev/null)" >&2
            printf '%s' "$out"
          }

          rank() { case "$1" in red) echo 3;; amber) echo 2;; *) echo 1;; esac; }
          worst=green
          bump() { [ "$(rank "$1")" -gt "$(rank "$worst")" ] && worst="$1" || true; }

          lines=""
          add() { lines="$lines"$'\n'"$1"; }

          # ---- Supabase (DB size vs 500MB Free tier + central row counts) -----
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            add "• Supabase: לא מוגדר"
          else
            size="$(psql_q 'SELECT pg_database_size(current_database());')"
            if printf '%s' "$size" | grep -qE '^[0-9]+$'; then
              pct=$(( size * 100 / 524288000 ))
              mb="$(awk "BEGIN{printf \"%.1f\", $size/1048576}")"
              if   [ "$pct" -ge 90 ]; then e="🔴"; bump red
              elif [ "$pct" -ge 70 ]; then e="🟠"; bump amber
              else e="🟢"; fi
              add "• Supabase DB: $e ${mb}MB / 500MB (${pct}%)"
            else
              add "• Supabase DB: ⚪ לא זמין"
            fi
            tr="$(psql_q 'SELECT count(*) FROM public.trades;')";   [ -n "$tr" ] || tr="?"
            fb="$(psql_q 'SELECT count(*) FROM public.feedback;')"; [ -n "$fb" ] || fb="?"
            wl="$(psql_q 'SELECT count(*) FROM public.waitlist;')"; [ -n "$wl" ] || wl="?"
            add "• Supabase שורות: trades $tr · feedback $fb · waitlist $wl"
          fi

          # ---- Vercel (projects + last deployment; bandwidth not in public API) --
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            add "• Vercel: לא מוגדר"
          else
            set +x
            vres="$(curl -sS --max-time 20 "https://api.vercel.com/v9/projects" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || echo '{}')"
            vcount="$(echo "$vres" | jq '(.projects // []) | length' 2>/dev/null || echo 0)"
            dres="$(curl -sS --max-time 20 "https://api.vercel.com/v6/deployments?limit=1" \
              -H "Authorization: Bearer $VERCEL_TOKEN" 2>/dev/null || echo '{}')"
            dstate="$(echo "$dres" | jq -r '.deployments[0].state // .deployments[0].readyState // "unknown"' 2>/dev/null || echo unknown)"
            add "• Vercel: 🟢 ${vcount} פרויקטים · deployment אחרון ${dstate}"
            add "   bandwidth/builds: לא זמין דרך API (מוצג ב-Dashboard)"
          fi

          # ---- Anthropic (usage/cost needs an Admin key, not ANTHROPIC_API_KEY) --
          add "• Anthropic: ⚪ לא זמין (דורש Admin API key)"

          case "$worst" in
            red)   color=$RED;   tag="🔴 מעל 90% ממכסה";;
            amber) color=$AMBER; tag="🟠 מעל 70%";;
            *)     color=$GREEN; tag="🟢 מתחת ל-70%";;
          esac
          desc="$(printf '💰 Cost Watchdog — %s%s\nסיווג כולל: %s\nנבדק: %s' \
            "$stamp" "$lines" "$tag" "$stamp")"
          jq -n --argjson c "$color" --arg d "$desc" '{color:$c,description:$d}' > cost-embed.json
          echo "cost-embed:"; cat cost-embed.json

      - name: Growth Pulse
        continue-on-error: true
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -uo pipefail
          set +e                    # runner injects `bash -e`; disable it so a single failing query degrades per-metric instead of aborting
          GREEN=3066993; AMBER=15844367
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          RO="SET default_transaction_read_only = on;"
          psql_q() { # runs one read-only query; on error surfaces psql's first line (never the conn string) and returns empty
            local out
            out="$(psql -v ON_ERROR_STOP=1 -tAq "$SUPABASE_DB_URL" -c "$RO $1" 2>/tmp/psqlerr)" \
              || echo "::warning::psql query failed: $(head -1 /tmp/psqlerr 2>/dev/null)" >&2
            printf '%s' "$out"
          }

          mkdir -p .fleet-state
          PREV=.fleet-state/growth-prev.json
          [ -f "$PREV" ] || echo '{}' > "$PREV"
          # arrow: compare today's value to yesterday's stored value for the same key
          arrow() { # cur key
            local c="$1" p
            p="$(jq -r --arg k "$2" '.[$k] // empty' "$PREV" 2>/dev/null)"
            { [ -z "$p" ] || [ -z "$c" ]; } && { echo ""; return; }
            printf '%s%s' "$p" "$c" | grep -qE '^[0-9]+$' || { echo ""; return; }
            if   [ "$c" -gt "$p" ]; then echo " (▲ מ-$p אתמול)"
            elif [ "$c" -lt "$p" ]; then echo " (▼ מ-$p אתמול)"
            else echo " (ללא שינוי)"; fi
          }

          color=$GREEN
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            desc="$(printf '📈 Growth Pulse — 24 שעות אחרונות\n• Supabase: לא מוגדר\nנבדק: %s' "$stamp")"
            jq -n --argjson c "$color" --arg d "$desc" '{color:$c,description:$d}' > growth-embed.json
            echo "growth-embed:"; cat growth-embed.json
            exit 0
          fi

          # ---- aggregate SELECTs only — no email/name/user_id/trade content ----
          s24="$(psql_q "SELECT count(*) FROM auth.users WHERE created_at >= now() - interval '24 hours';")"
          tot="$(psql_q "SELECT count(*) FROM auth.users;")"
          act="$(psql_q "SELECT count(DISTINCT user_id) FROM public.trades WHERE user_id IS NOT NULL;")"
          pow="$(psql_q "SELECT count(*) FROM (SELECT user_id FROM public.trades WHERE user_id IS NOT NULL GROUP BY user_id HAVING count(*) >= 10) t;")"
          tr24="$(psql_q "SELECT count(*) FROM public.trades WHERE \"createdAt\" >= now() - interval '24 hours';")"
          wlTot="$(psql_q "SELECT count(*) FROM public.waitlist;")"
          wl24="$(psql_q "SELECT count(*) FROM public.waitlist WHERE created_at >= now() - interval '24 hours';")"
          # top-3 sources: aggregate labels + counts only (no emails)
          srcs="$(psql_q "SELECT coalesce(source,'direct') || ' ' || count(*) FROM public.waitlist GROUP BY coalesce(source,'direct') ORDER BY count(*) DESC LIMIT 3;")"
          top="$(printf '%s' "$srcs" | awk 'NF{ if(n++) printf " · "; printf "%s", $0 }')"

          # ---- threshold-only windows (deliberately NOT the 24h windows shown above,
          # so a threshold breach never looks like a duplicate/contradictory metric) ----
          tr48="$(psql_q "SELECT count(*) FROM public.trades WHERE \"createdAt\" >= now() - interval '48 hours';")"
          s72="$(psql_q "SELECT count(*) FROM auth.users WHERE created_at >= now() - interval '72 hours';")"

          show() { [ -n "$1" ] && printf '%s' "$1" || printf 'לא זמין'; }
          pctact=""
          act_pct_num=""
          if printf '%s%s' "$act" "$tot" | grep -qE '^[0-9]+$' && [ "${tot:-0}" -gt 0 ]; then
            act_pct_num=$(( act * 100 / tot ))
            pctact=" (${act_pct_num}%)"
          fi

          # ---- thresholds: zero new state — each fed straight from a query/value above,
          # same act_pct_num the display line uses, so there is no drift between shown and
          # checked numbers ----
          warn_lines=""
          warn() { warn_lines="$warn_lines"$'\n'"$1"; }
          if printf '%s' "$tr48" | grep -qE '^[0-9]+$' && [ "$tr48" -eq 0 ]; then
            warn "🟠 אין עסקאות חדשות ב-48 השעות האחרונות"
          fi
          if printf '%s' "$s72" | grep -qE '^[0-9]+$' && [ "$s72" -eq 0 ]; then
            warn "🟠 אין נרשמים חדשים ב-72 השעות האחרונות"
          fi
          if [ -n "$act_pct_num" ] && [ "$act_pct_num" -lt 25 ]; then
            warn "🟠 Activation מתחת ל-25%"
          fi
          [ -n "$warn_lines" ] && color=$AMBER

          lines=""
          add() { lines="$lines"$'\n'"$1"; }
          add "• נרשמים חדשים (24ש'): $(show "$s24")$(arrow "$s24" signups24)"
          add "• סה\"כ משתמשים: $(show "$tot")$(arrow "$tot" total)"
          add "• Activation (≥1 עסקה): $(show "$act")$pctact"
          add "• Power users (≥10 עסקאות): $(show "$pow")"
          add "• עסקאות שנוצרו (24ש'): $(show "$tr24")$(arrow "$tr24" trades24)"
          # "רשימת המתנה: N" read as "N people waiting". The number is the raw row
          # count of the waitlist table — it includes rows already invited and rows
          # already converted, so it is a table size, not a queue length.
          add "• סך שורות waitlist: $(show "$wlTot")$(arrow "$wl24" waitlist24 | sed 's/אתמול/ב-24ש/')"
          [ -n "$top" ] && add "• מקורות מובילים: $top"

          header="📈 Growth Pulse — 24 שעות אחרונות"
          if [ -n "$warn_lines" ]; then
            header="$header"$'\n'"⚠️ דורש תשומת לב:$warn_lines"
          fi
          desc="$(printf '%s%s\nנבדק: %s' "$header" "$lines" "$stamp")"
          jq -n --argjson c "$color" --arg d "$desc" '{color:$c,description:$d}' > growth-embed.json
          echo "growth-embed:"; cat growth-embed.json

          # persist today's snapshot for tomorrow's deltas (aggregate ints only) — tr48/s72/
          # act_pct_num are threshold-only and deliberately NOT persisted (zero new state)
          jq -n \
            --arg signups24 "${s24:-}" --arg total "${tot:-}" --arg trades24 "${tr24:-}" \
            --arg waitlist24 "${wl24:-}" --arg activation "${act:-}" --arg power "${pow:-}" \
            '{signups24:$signups24,total:$total,trades24:$trades24,waitlist24:$waitlist24,activation:$activation,power:$power}' \
            > "$PREV"
          echo "state:"; cat "$PREV"

      - name: Watchdog liveness
        # Mutual watch: watchdog.yml checks the 11 scheduled agents, and this step checks
        # watchdog.yml. An agent cannot report its own death — watchdog listing itself in
        # its own MAXAGE table would only ever be evaluated on runs where it *did* run.
        # Fleet Daily (06:00 UTC) precedes Watchdog (08:00 UTC), so it always reads a run
        # that has already finished, never one in flight.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WATCHED_WF: watchdog.yml
          MAX_H: '30'
        run: |
          set -uo pipefail
          set +e                    # runner injects `bash -e`; a failed API call must degrade to 🔴, not abort
          RED=15158332; GREEN=3066993
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"

          resp="$(gh api "/repos/$REPO/actions/workflows/$WATCHED_WF/runs?status=success&per_page=1" 2>/tmp/gherr)"
          rc=$?
          if [ $rc -ne 0 ]; then
            color=$RED
            line="🔴 בדיקת ה-Watchdog עצמה נכשלה: $(head -1 /tmp/gherr 2>/dev/null || echo 'gh api error')"
          else
            updated="$(printf '%s' "$resp" | jq -r '.workflow_runs[0].updated_at // empty' 2>/dev/null)"
            upd_epoch=""
            [ -n "$updated" ] && upd_epoch="$(date -u -d "$updated" +%s 2>/dev/null)"
            if [ -z "$updated" ]; then
              color=$RED
              line="🐕 Watchdog מעולם לא רץ בהצלחה — שומר הצי עצמו שקט"
            elif [ -z "$upd_epoch" ]; then
              color=$RED
              line="🔴 בדיקת ה-Watchdog עצמה נכשלה: timestamp לא תקין ($updated)"
            else
              # ⚠️ B-277 — אתר **שני** של אותו באג. השוואה בשניות; `age_h` לתצוגה בלבד.
              age_s=$(( $(date -u +%s) - upd_epoch ))
              age_h=$(( age_s / 3600 ))
              if [ "$age_s" -gt "$(( MAX_H * 3600 ))" ]; then
                color=$RED
                line="🐕 Watchdog לא רץ בהצלחה מאז $updated (לפני ${age_h}ש', סף ${MAX_H}ש') — שומר הצי עצמו שקט"
              else
                color=$GREEN
                line="🐕 Watchdog: 🟢 ריצה מוצלחת אחרונה לפני ${age_h}ש' (סף ${MAX_H}ש', $updated)"
              fi
            fi
          fi

          desc="$(printf '🐕 Watchdog Liveness — מי שומר על השומר\n%s\nנבדק: %s' "$line" "$stamp")"
          jq -n --argjson c "$color" --arg d "$desc" '{color:$c,description:$d}' > watchdog-embed.json
          echo "watchdog-embed:"; cat watchdog-embed.json

      - name: Alert correlation
        # Every other guardian measures PRESENCE ("did X run?"). This one measures
        # COVERAGE: of the runs that actually failed in the last 24h and are on
        # failure-alert.yml's watch list, how many produced an alert run? Its
        # denominator is REAL FAILURES, not time — so in a quiet week it reports
        # "0 failures" and is structurally incapable of false-alarming.
        #
        # Three measured limitations, stated rather than hidden (2026-08-15):
        #  1. A Failure Alert run carries NO field naming the run that triggered it,
        #     so the match is by TIME (alert created within WINDOW_MIN of the failed
        #     run's conclusion), not by id. Two failures inside one window are
        #     indistinguishable — this over-credits, never under-credits.
        #  2. `status=success`, not `completed`: 299 of the last 300 Failure Alert
        #     runs are `skipped` (the job-level `if:` gate on non-failure
        #     conclusions), so `completed` would count skips as alerts.
        #  3. Retrospective, ≤24h, and it does NOT replace the canary drill —
        #     it can only see failures that happened, never prove one would fire.
        #
        # The watch list is READ FROM failure-alert.yml over the contents API rather
        # than restated here: this workflow has no checkout step, and a second copy
        # of the list is a copy that drifts (R-6).
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WINDOW_MIN: '15'
        run: |
          set -uo pipefail
          set +e                    # runner injects `bash -e`; a failed API call must degrade to 🔴, not abort
          RED=15158332; GREEN=3066993
          stamp="$(date -u '+%Y-%m-%d %H:%M UTC')"
          since="$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')"

          bail() { # colour-red embed + exit 0 — a broken check must SPEAK, never vanish
            jq -n --argjson c "$RED" --arg d "$(printf '🔗 Alert Correlation — הבדיקה עצמה נכשלה\n🔴 %s\nנבדק: %s' "$1" "$stamp")" \
              '{color:$c,description:$d}' > alertcorr-embed.json
            echo "alertcorr-embed:"; cat alertcorr-embed.json
            exit 0
          }

          fa_b64="$(gh api "/repos/$REPO/contents/.github/workflows/failure-alert.yml" --jq '.content' 2>/tmp/acerr)"
          [ $? -eq 0 ] && [ -n "$fa_b64" ] || bail "לא ניתן לקרוא את failure-alert.yml: $(head -1 /tmp/acerr 2>/dev/null || echo 'gh api error')"
          watch="$(printf '%s' "$fa_b64" | tr -d '\n' | base64 -d 2>/dev/null \
            | grep -oE 'workflows: \[[^]]*\]' | grep -oE '"[^"]+"' | tr -d '"')"
          [ -n "$watch" ] || bail "רשימת הצפייה נקראה ריקה — ייתכן ש-failure-alert.yml שינה מבנה"
          n_watch="$(printf '%s\n' "$watch" | grep -c .)"

          runs="$(gh api "/repos/$REPO/actions/runs?status=failure&created=%3E$since&per_page=100" \
            --jq '.workflow_runs[] | [.name, .updated_at, .html_url] | @tsv' 2>/tmp/acerr)"
          [ $? -eq 0 ] || bail "לא ניתן לקרוא ריצות כושלות: $(head -1 /tmp/acerr 2>/dev/null || echo 'gh api error')"

          alerts="$(gh api "/repos/$REPO/actions/workflows/failure-alert.yml/runs?status=success&created=%3E$since&per_page=100" \
            --jq '.workflow_runs[].created_at' 2>/tmp/acerr)"
          [ $? -eq 0 ] || bail "לא ניתן לקרוא ריצות Failure Alert: $(head -1 /tmp/acerr 2>/dev/null || echo 'gh api error')"
          alert_epochs=""
          while IFS= read -r a; do
            [ -n "$a" ] || continue
            ae="$(date -u -d "$a" +%s 2>/dev/null)" && alert_epochs="$alert_epochs $ae"
          done <<< "$alerts"

          window=$(( WINDOW_MIN * 60 ))
          total=0; covered=0; miss_lines=""
          while IFS="$(printf '\t')" read -r wname wupd wurl; do
            [ -n "$wname" ] || continue
            printf '%s\n' "$watch" | grep -Fxq "$wname" || continue   # not watched by design
            total=$((total+1))
            fe="$(date -u -d "$wupd" +%s 2>/dev/null)"
            if [ -z "$fe" ]; then
              miss_lines="${miss_lines}"$'\n'"🔴 $wname — timestamp לא תקין ($wupd)"
              continue
            fi
            hit=0
            for ae in $alert_epochs; do
              # allow 60s of clock skew before the conclusion timestamp
              if [ "$ae" -ge $((fe-60)) ] && [ "$ae" -le $((fe+window)) ]; then hit=1; break; fi
            done
            if [ "$hit" = "1" ]; then
              covered=$((covered+1))
            else
              miss_lines="${miss_lines}"$'\n'"🔴 $wname — נכשל ב-$wupd ⛔ ובלי התראה תוך ${WINDOW_MIN} דק' · $wurl"
            fi
          done <<< "$runs"

          if [ "$total" -eq 0 ]; then
            color=$GREEN
            body="$(printf '🟢 0 כשלים ב-24ש%s אצל %s ה-workflows שבצפייה — ⚠️ מכנה ריק ⛔ אינו ראיה שהרשת עובדת. ההוכחה היא תרגיל הקנרית.' "'" "$n_watch")"
          elif [ -z "$miss_lines" ]; then
            color=$GREEN
            body="$(printf '🟢 %s/%s כשלים שבצפייה קיבלו התראה תוך %s דק%s' "$covered" "$total" "$WINDOW_MIN" "'")"
          else
            color=$RED
            body="$(printf '🔴 %s/%s כשלים שבצפייה קיבלו התראה — %s ⛔ ללא התראה:%b' \
              "$covered" "$total" "$((total-covered))" "$miss_lines")"
          fi
          desc="$(printf '🔗 Alert Correlation — האם התראות באמת נמסרו\n%s\nנבדק: %s' "$body" "$stamp")"
          jq -n --argjson c "$color" --arg d "$desc" '{color:$c,description:$d}' > alertcorr-embed.json
          echo "alertcorr-embed:"; cat alertcorr-embed.json

      - name: Report to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          set +e                    # post both embeds even if the first errors
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::warning::SENTINEL_DISCORD_WEBHOOK not set — skipping Discord."
            NO_WEBHOOK=1
          else
            NO_WEBHOOK=0
          fi
          post() { # embed-json-file
            [ -f "$1" ] || { echo "::warning::$1 missing (step failed) — nothing to post"; return; }
            local color desc payload rc
            color="$(jq -r '.color' "$1")"; desc="$(jq -r '.description' "$1")"
            if [ "$NO_WEBHOOK" = "1" ]; then echo "[dry] $desc"; return; fi
            set +x
            payload="$(jq -n --arg u "SwingEdge Fleet" --arg d "$desc" --argjson c "$color" \
              '{username:$u, embeds:[{description:$d, color:$c}]}')"
            rc="$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H "Content-Type: application/json" \
              -d "$payload" "$DISCORD_WEBHOOK" 2>/dev/null || echo 000)"
            echo "discord POST -> HTTP $rc"   # 204 = success; never prints the URL
          }
          post cost-embed.json
          post growth-embed.json
          post watchdog-embed.json
          post alertcorr-embed.json

      - name: Save day-over-day state
        if: always()
        uses: actions/cache/save@v6
        with:
          path: .fleet-state
          key: fleet-daily-state-${{ github.run_id }}
