name: Health Monitor

# DEPRECATED (2026-07-25): superseded by Sentinel (sentinel.yml), section
# "3. API health", which performs this same /api/health probe on the same
# domain and more (parses status, failing[] incl. Supabase, warnings[]).
# Schedule removed to stop noise/concurrency conflicts with Sentinel; kept
# dispatchable for manual backup. Do not delete.

on:
  workflow_dispatch:

concurrency:
  group: health-monitor
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Curl production /api/health
        env:
          HEALTH_URL: ${{ vars.HEALTH_URL }}
        run: |
          set -euo pipefail
          URL="${HEALTH_URL:-https://swing-edge.com/api/health}"
          code="$(curl -sS -o /tmp/health.json -w '%{http_code}' --max-time 20 --retry 2 --retry-delay 5 "$URL")"
          echo "HTTP $code"
          cat /tmp/health.json
          echo
          if [ "$code" != "200" ]; then
            echo "::error::Health check failed (HTTP $code)"
            exit 1
          fi
