name: Watchdog

# Catches the "silent death" gap that failure-alert.yml cannot: it fires only when a
# workflow's own run *fails*. If a workflow never runs at all (cron disabled, secret
# expired, repo transferred, workflow file broken) failure-alert never sees a `failure`
# event and stays silent — silence then looks identical to health. Watchdog checks, once
# a day, "when did each scheduled workflow last succeed?" against a fixed max-age table,
# and always posts to Discord — the only workflow required to post green every single day.
# Read-only: gh api only (actions:read), zero repo writes, zero new secrets.
#
# Known limitation (documented, not solved by design): the max-age table below is a
# manual list. A newly-added scheduled workflow is not auto-discovered by GitHub's API —
# the consistency check further down only *flags* the gap (🟠 "workflow מתוזמן לא
# מנוטר"), it does not close it. See docs/plans/PLAN-2026-07-27-watchdog-thresholds.md.

on:
  schedule:
    - cron: '0 8 * * *'   # 08:00 UTC = 11:00 Israel — after every other daily/hourly cron has had a chance to run
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read           # to check out the repo for the consistency check
  actions: read            # to read workflow-run history

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - name: Check scheduled workflows
        id: check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +e                    # runner injects `bash -e`; disable it so one bad check degrades, not aborts
          RED=15158332; AMBER=15844367; GREEN=3066993

          # ---- fixed max-age table (hours) — one entry per scheduled workflow file ----
          declare -A MAXAGE=(
            [sentinel.yml]=3
            [daily-digest.yml]=30
            [fleet-daily.yml]=30
            [user-analytics.yml]=30
            [smoke.yml]=30
            [data-guardian.yml]=80
            [fleet-weekly.yml]=192
            [analyst.yml]=192
            [arch-auditor.yml]=192
            [backup.yml]=192
            [restore-drill.yml]=840
          )

          now_epoch=$(date -u +%s)
          stale_lines=""; never_lines=""; failcheck_lines=""; consistency_lines=""
          n_problem=0

          for wf in "${!MAXAGE[@]}"; do
            max_h="${MAXAGE[$wf]}"
            resp="$(gh api "/repos/$REPO/actions/workflows/$wf/runs?status=success&per_page=1" 2>/tmp/gherr)"
            rc=$?
            if [ $rc -ne 0 ]; then
              failcheck_lines="${failcheck_lines}\n🔴 $wf — הבדיקה עצמה נכשלה: $(head -1 /tmp/gherr 2>/dev/null || echo 'gh api error')"
              n_problem=$((n_problem+1))
              continue
            fi
            updated="$(printf '%s' "$resp" | jq -r '.workflow_runs[0].updated_at // empty' 2>/dev/null)"
            if [ -z "$updated" ]; then
              never_lines="${never_lines}\n🔴 $wf — מעולם לא הצליח (אין ריצה מוצלחת בהיסטוריה)"
              n_problem=$((n_problem+1))
              continue
            fi
            upd_epoch="$(date -u -d "$updated" +%s 2>/dev/null)"
            if [ -z "$upd_epoch" ]; then
              failcheck_lines="${failcheck_lines}\n🔴 $wf — הבדיקה עצמה נכשלה: timestamp לא תקין ($updated)"
              n_problem=$((n_problem+1))
              continue
            fi
            # ⚠️ B-277 — ההשוואה היא **בשניות**. `$(( ))` קוטמת כלפי אפס, ולכן השוואת
            # שעות שלמות עם `-gt` הזיזה **כל** סף בטבלה בשעה בדיוק: `3` התנהג כ-`4`.
            # `age_h` נשאר מחושב **לתצוגה בלבד** — מחרוזת ההודעה ⛔ אינה משתנה.
            age_s=$(( now_epoch - upd_epoch ))
            age_h=$(( age_s / 3600 ))
            if [ "$age_s" -gt "$(( max_h * 3600 ))" ]; then
              stale_lines="${stale_lines}\n🟠 $wf — ריצה מוצלחת אחרונה לפני ${age_h}ש' (סף: ${max_h}ש', $updated)"
              n_problem=$((n_problem+1))
            fi
          done

          # ---- consistency check: every workflow file with a `schedule:` trigger must be
          # in MAXAGE, and every MAXAGE key must correspond to a real file. Cheap grep over
          # the checked-out tree — keeps the table from silently drifting when a new cron
          # job is added or a workflow file is renamed/removed. ----
          for f in .github/workflows/*.yml; do
            base="$(basename "$f")"
            [ "$base" = "watchdog.yml" ] && continue   # self: watched by fleet-daily.yml instead — an agent cannot report its own death
            if grep -qE '^\s*schedule:\s*$' "$f" && [ -z "${MAXAGE[$base]+x}" ]; then
              consistency_lines="${consistency_lines}\n⚠️ workflow מתוזמן לא מנוטר: $base"
              n_problem=$((n_problem+1))
            fi
          done
          for wf in "${!MAXAGE[@]}"; do
            if [ ! -f ".github/workflows/$wf" ]; then
              consistency_lines="${consistency_lines}\n⚠️ ערך יתום בטבלה: $wf"
              n_problem=$((n_problem+1))
            fi
          done

          if [ "$n_problem" -eq 0 ]; then
            color=$GREEN
            desc="🐕 Watchdog — כל ${#MAXAGE[@]} הסוכנים המתוזמנים רצו בזמן"
          else
            if [ -n "$never_lines" ] || [ -n "$failcheck_lines" ]; then color=$RED; else color=$AMBER; fi
            desc="$(printf '🐕 Watchdog — %s ממצא/ים:%b%b%b%b' "$n_problem" "$stale_lines" "$never_lines" "$failcheck_lines" "$consistency_lines")"
          fi

          jq -n --argjson c "$color" --arg d "$desc" '{color:$c,description:$d}' > watchdog-result.json
          echo "watchdog-result:"; cat watchdog-result.json

      # Discord is Watchdog's ONLY output channel — there is no mail fallback.
      # A post that does not land means the daily green/amber/red report reached
      # nobody, so this step must be able to fail the run (Watchdog is itself in
      # failure-alert.yml's watch list, so a red run does get reported). Before
      # 2026-08-15 it was continue-on-error with an unchecked `curl -sS`: a
      # revoked webhook printed "HTTP 401" and the run stayed green forever.
      - name: Report to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.SENTINEL_DISCORD_WEBHOOK }}
        run: |
          set -uo pipefail
          if [ -z "${DISCORD_WEBHOOK:-}" ]; then
            echo "::error::SENTINEL_DISCORD_WEBHOOK not set — the daily report has nowhere to go."
            exit 1
          fi
          if [ -f watchdog-result.json ]; then
            color="$(jq -r '.color' watchdog-result.json)"
            desc="$(jq -r '.description' watchdog-result.json)"
          else
            # The check step crashed before producing a result at all — this must NOT be
            # silent. Post red rather than skipping, per CLAUDE.md §2 (zero silent failure).
            color=15158332
            desc="🔴 Watchdog — צעד הבדיקה קרס לפני שהפיק תוצאה. בדוק את לוג ה-Action."
          fi
          payload="$(jq -n --arg u "SwingEdge Watchdog" --arg d "$desc" --argjson c "$color" \
            '{username:$u, embeds:[{description:$d, color:$c}]}')"
          code="$(curl -sS -o /tmp/discord.out -w '%{http_code}' \
            -X POST -H "Content-Type: application/json" -d "$payload" "$DISCORD_WEBHOOK")"
          echo "discord POST -> HTTP $code"
          if [ "$code" != "204" ]; then
            echo "::error::Discord rejected the watchdog report (HTTP $code)"
            head -c 500 /tmp/discord.out || true
            exit 1
          fi
